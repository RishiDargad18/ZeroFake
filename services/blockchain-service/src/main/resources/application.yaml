spring:
  application:
    name: blockchain-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/zerofake_blockchain}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT:8083}

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: ${SQL_LOG_LEVEL:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

product:
  service:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8082}

zerofake:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

jwt:
  # Must match the authentication service exactly. This service validates
  # tokens; it never issues them.
  secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbi16ZXJvZmFrZS1obWFjLXNoYS1rZXktMjU2LWJpdHM=}
  issuer: ${JWT_ISSUER:zerofake-auth-service}

# Hyperledger Fabric connection.
#
# FABRIC_CRYPTO_PATH must point at the Org1 peer organisation directory of your
# Fabric network, for example:
#   <fabric-samples>/test-network/organizations/peerOrganizations/org1.example.com
# The individual certificate and key paths are derived from it, and each one can
# still be overridden individually if your layout differs.
fabric:
  msp-id: ${FABRIC_MSP_ID:Org1MSP}
  channel-name: ${FABRIC_CHANNEL_NAME:mychannel}
  chaincode-name: ${FABRIC_CHAINCODE_NAME:zerofake}

  crypto-path: ${FABRIC_CRYPTO_PATH:./fabric/organizations/peerOrganizations/org1.example.com}

  cert-path: ${FABRIC_CERT_PATH:${fabric.crypto-path}/users/User1@org1.example.com/msp/signcerts/cert.pem}
  key-directory-path: ${FABRIC_KEY_DIRECTORY_PATH:${fabric.crypto-path}/users/User1@org1.example.com/msp/keystore}
  tls-cert-path: ${FABRIC_TLS_CERT_PATH:${fabric.crypto-path}/peers/peer0.org1.example.com/tls/ca.crt}

  peer-endpoint: ${FABRIC_PEER_ENDPOINT:dns:///localhost:7051}
  peer-host-alias: ${FABRIC_PEER_HOST_ALIAS:peer0.org1.example.com}
