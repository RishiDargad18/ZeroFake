name: zerofake

# ZeroFake single-VM production deployment.
#
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# Differences from the development stack in the repository root:
#
#   - only nginx is published; no service or database port faces the internet
#   - the browser talks to one origin, so there are no cross-origin requests
#   - containers restart automatically and have memory limits, leaving headroom
#     for the Fabric network running alongside them on the same machine
#   - seeding must be configured explicitly: a public deployment with the
#     documented demo password would be an open door
#
# Hyperledger Fabric runs on the host, not here. deploy/setup-fabric.sh brings
# it up; the blockchain service reaches it through the host gateway.

services:

  nginx:
    image: nginx:1.27-alpine
    container_name: zerofake-nginx
    restart: unless-stopped
    depends_on: [frontend, auth-service, product-service, blockchain-service, fraud-detection-service]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/zerofake.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    networks: [zerofake]

  postgres:
    image: postgres:16-alpine
    container_name: zerofake-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME must be set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: postgres
    # Deliberately not published. The database is reachable only from the
    # compose network; use `docker compose exec postgres psql` for access.
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    networks: [zerofake]

  auth-service:
    build:
      context: ../services/auth-service
    container_name: zerofake-auth
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/zerofake_auth
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_ISSUER: ${JWT_ISSUER:-zerofake-auth-service}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:-900000}
      SEED_ENABLED: ${SEED_ENABLED:?set SEED_ENABLED explicitly - see deploy/.env.prod.example}
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:?SEED_DEFAULT_PASSWORD must be set}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:?PUBLIC_URL must be set}
      JAVA_OPTS: "-XX:MaxRAMPercentage=70.0"
    mem_limit: 900m
    networks: [zerofake]

  product-service:
    build:
      context: ../services/product-service
    container_name: zerofake-product
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/zerofake_product
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-zerofake-auth-service}
      SEED_ENABLED: ${SEED_ENABLED}
      QR_STORAGE_DIRECTORY: /app/data/qr-codes
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL}
      JAVA_OPTS: "-XX:MaxRAMPercentage=70.0"
    volumes:
      - qr-codes:/app/data/qr-codes
    mem_limit: 900m
    networks: [zerofake]

  blockchain-service:
    build:
      context: ../services/blockchain-service
    container_name: zerofake-blockchain
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/zerofake_blockchain
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-zerofake-auth-service}
      PRODUCT_SERVICE_URL: http://product-service:8082
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL}
      JAVA_OPTS: "-XX:MaxRAMPercentage=70.0"
      FABRIC_CRYPTO_PATH: /fabric
      FABRIC_MSP_ID: ${FABRIC_MSP_ID:-Org1MSP}
      FABRIC_CHANNEL_NAME: ${FABRIC_CHANNEL_NAME:-mychannel}
      FABRIC_CHAINCODE_NAME: ${FABRIC_CHAINCODE_NAME:-zerofake}
      # Fabric runs on the host, alongside this stack.
      FABRIC_PEER_ENDPOINT: ${FABRIC_PEER_ENDPOINT:-dns:///host.docker.internal:7051}
      FABRIC_PEER_HOST_ALIAS: ${FABRIC_PEER_HOST_ALIAS:-peer0.org1.example.com}
    volumes:
      - ${FABRIC_CRYPTO_PATH:?FABRIC_CRYPTO_PATH must point at the Org1 crypto material}:/fabric:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 900m
    networks: [zerofake]

  fraud-detection-service:
    build:
      context: ../services/fraud-detection-service
    container_name: zerofake-fraud
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/zerofake_fraud
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-zerofake-auth-service}
      PRODUCT_SERVICE_URL: http://product-service:8082
      BLOCKCHAIN_SERVICE_URL: http://blockchain-service:8083
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL}
      JAVA_OPTS: "-XX:MaxRAMPercentage=70.0"
    mem_limit: 900m
    networks: [zerofake]

  frontend:
    build:
      context: ../zerofake-frontend
      args:
        # Same-origin paths, not absolute URLs. nginx routes each prefix to its
        # service, so the browser only ever sees one host.
        VITE_AUTH_API: /auth
        VITE_PRODUCT_API: /products
        VITE_BLOCKCHAIN_API: /blockchain
        VITE_FRAUD_API: /fraud
    container_name: zerofake-frontend
    restart: unless-stopped
    mem_limit: 128m
    networks: [zerofake]

  # Renews the TLS certificate. Exits immediately when none is configured.
  certbot:
    image: certbot/certbot:latest
    container_name: zerofake-certbot
    restart: unless-stopped
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do certbot renew --webroot -w /var/www/certbot --quiet;
             sleep 12h & wait $${!}; done"
    networks: [zerofake]

volumes:
  postgres-data:
  qr-codes:
  certbot-certs:
  certbot-webroot:

networks:
  zerofake:
    driver: bridge
