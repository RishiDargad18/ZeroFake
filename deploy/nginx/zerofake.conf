# ZeroFake reverse proxy — HTTP.
#
# This is the active configuration. deploy/setup-tls.sh replaces it with a
# rendering of zerofake-tls.conf.template once a certificate exists.
#
# The whole platform is served from a single origin, which means:
#
#   - one port faces the internet instead of five
#   - there are no cross-origin requests at all, so CORS stops being a concern
#   - TLS terminates in exactly one place
#
# Path prefixes map onto services. The trailing slash on proxy_pass is
# load-bearing: it strips the prefix, so /auth/api/v1/auth/login arrives at the
# auth service as /api/v1/auth/login.

upstream frontend           { server frontend:80; }
upstream auth_service       { server auth-service:8081; }
upstream product_service    { server product-service:8082; }
upstream blockchain_service { server blockchain-service:8083; }
upstream fraud_service      { server fraud-detection-service:8085; }

# The application has no rate limiting of its own, so this is the only thing
# between a login form and an unbounded password-guessing loop.
#
# 20/minute still caps guessing at a rate that BCrypt's work factor makes
# hopeless, while leaving room for a mistyped password, a demo audience behind
# one NAT, and the token refresh that follows each login. Tightening this
# further blocks real users long before it inconveniences an attacker.
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m   rate=30r/s;

# nginx answers 503 by default, which says "the server is broken" rather than
# "you are going too fast". 429 is the accurate status and tells a client it
# may retry.
limit_req_status 429;

server {
    listen 80;
    server_name _;

    # Certbot's HTTP-01 challenge must stay reachable over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/snippets/zerofake-routes.conf;
}
