# Routing shared by the HTTP and HTTPS server blocks.

client_max_body_size 10m;

# Do not advertise the exact nginx build to the internet.
server_tokens off;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 10s;
proxy_send_timeout    60s;

# Ledger writes wait for a Fabric block to commit, which is slower than a
# normal request. This must exceed the gateway's own commit timeout.
proxy_read_timeout    90s;

# ---- authentication -------------------------------------------------------

location = /auth/api/v1/auth/login {
    limit_req zone=login_zone burst=10 nodelay;
    proxy_pass http://auth_service/api/v1/auth/login;
}

location = /auth/api/v1/auth/register {
    limit_req zone=login_zone burst=10 nodelay;
    proxy_pass http://auth_service/api/v1/auth/register;
}

location /auth/ {
    limit_req zone=api_zone burst=20 nodelay;
    proxy_pass http://auth_service/;
}

# ---- catalogue, ledger, fraud --------------------------------------------

location /products/ {
    limit_req zone=api_zone burst=20 nodelay;
    proxy_pass http://product_service/;
}

location /blockchain/ {
    limit_req zone=api_zone burst=20 nodelay;
    proxy_pass http://blockchain_service/;
}

location /fraud/ {
    limit_req zone=api_zone burst=20 nodelay;
    proxy_pass http://fraud_service/;
}

# ---- operational ----------------------------------------------------------

# Aggregate health check for uptime monitoring. Individual actuator endpoints
# are deliberately not exposed publicly.
location = /healthz {
    access_log off;
    proxy_pass http://auth_service/actuator/health;
}

# ---- the web client -------------------------------------------------------

location / {
    proxy_pass http://frontend/;
}
